<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Scrifts</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html,
    body {
      height: 100%;
      background: #09090b;
      color: #a1a1aa;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      height: 37px;
      padding-left: 14px;
      border-bottom: 1px solid #27272a;
      background: #18181b;
      color: #fafafa;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    .spacer {
      flex: 1;
      height: 100%;
    }

    .close {
      width: 44px;
      height: 32px;
      border: 0;
      background: transparent;
      color: #a1a1aa;
      font-size: 16px;
      cursor: pointer;
    }

    .close:hover {
      background: #dc2626;
      color: #fff;
    }

    main {
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }

    .err {
      color: #f87171;
      max-width: 460px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <header data-tauri-drag-region>
    <span data-tauri-drag-region>Scrifts</span>
    <span class="spacer" data-tauri-drag-region></span>
    <button class="close" aria-label="Close"
      onclick="window.__TAURI__?.window?.getCurrentWindow?.()?.close()">&#x2715;</button>
  </header>
  <main>
    <div id="msg">Starting Scrifts…</div>
  </main>
  <script>
    window.__showError = function (err) {
      const el = document.getElementById('msg');
      el.className = 'err';
      el.textContent = err;
    };
  </script>
</body>

</html>
