[package]
name = "forge"
version = "0.1.0"
description = "A modern UI over the FontForge core"
authors = ["Scrifts"]
license = "GPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-decorum = "1.1.1"

[profile.release]
strip = true
lto = true


